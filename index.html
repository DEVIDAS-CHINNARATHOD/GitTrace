<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GitTrace — GitHub developer analytics dashboard. Track followers, repositories, and leaderboards.">
  <title>GitTrace - GitHub Developer Dashboard</title>
  <link rel="preconnect" href="https://api.github.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <!-- Chart.js loaded async so it never blocks page paint -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="container">

    <!-- Header -->
    <header class="header">
      <h1 class="title">GitTrace</h1>
      <p class="subtitle">Developer Analytics Dashboard</p>
    </header>

    <!-- Navigation -->
    <nav class="nav-tabs" role="tablist">
      <button class="tab-btn active" data-tab="leaderboard" role="tab" id="tab-leaderboard">Leaderboard</button>
      <button class="tab-btn" data-tab="explore" role="tab" id="tab-explore">Explore</button>
    </nav>

    <!-- ── Leaderboard Tab ── -->
    <section id="leaderboardSection" class="tab-section active" role="tabpanel" aria-labelledby="tab-leaderboard">

      <div id="loadingIndicator" class="loading-bar hidden">
        <div class="spinner"></div>
        <div class="load-body">
          <span class="load-text">Fetching developer data…</span>
          <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        </div>
      </div>

      <div class="filter-container">
        <button class="filter-btn active" data-filter="followers">Followers</button>
        <button class="filter-btn" data-filter="repos">Repositories</button>
        <button class="filter-btn" data-filter="following">Following</button>
        <button class="filter-btn" data-filter="commits">Recent Commits</button>
      </div>

      <div class="charts-grid">
        <div class="chart-card">
          <h3 class="chart-title">Top Performers</h3>
          <canvas id="topPerformersChart"></canvas>
        </div>
        <div class="chart-card">
          <h3 class="chart-title">Community Stats</h3>
          <canvas id="statsDistributionChart"></canvas>
        </div>
      </div>

      <div class="leaderboard-card">
        <h2 class="leaderboard-title" id="leaderboardTitleMain">Top by Activity</h2>
        <div id="leaderboardMain" class="leaderboard-list"></div>
      </div>

    </section>

    <!-- ── Explore Tab ── -->
    <section id="exploreSection" class="tab-section" role="tabpanel" aria-labelledby="tab-explore">
      <div id="userList" class="user-grid"></div>
    </section>


  </div>

  <!-- Profile Modal -->
  <div id="profileModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalUsername">
    <div class="modal-box">
      <button id="closeModal" class="modal-close" aria-label="Close">&times;</button>
      <img id="modalAvatar" src="" alt="Avatar" class="modal-avatar" loading="lazy">
      <h2 id="modalUsername" class="modal-name"></h2>
      <p id="modalBio" class="modal-bio"></p>
      <div class="modal-stats">
        <div class="mstat"><span class="mstat-label">Followers</span><span id="modalFollowers" class="mstat-value">0</span></div>
        <div class="mstat"><span class="mstat-label">Following</span><span id="modalFollowing" class="mstat-value">0</span></div>
        <div class="mstat"><span class="mstat-label">Repos</span><span id="modalRepos" class="mstat-value">0</span></div>
      </div>
      <a id="modalProfileLink" href="#" target="_blank" rel="noopener" class="btn btn-primary">View on GitHub</a>
    </div>
  </div>



  <script src="script.js" defer></script>
</body>
</html>
